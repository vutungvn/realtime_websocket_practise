<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopFast - Điều khiển thử nghiệm</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 26px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    button { padding: 7px 12px; border: 1px solid #ccc; background: #f6f6f6; border-radius: 6px; cursor: pointer; }
    button.on { background: #ee4d2d; color: #fff; border-color: #ee4d2d; }
    table { border-collapse: collapse; } td, th { padding: 4px 10px; border-bottom: 1px solid #eee; text-align: left; }
    pre { background: #f6f6f6; padding: 10px; border-radius: 6px; font-size: 13px; }
    .muted { color: #777; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Điều khiển thử nghiệm (truy cập thẳng server, không qua bộ cân bằng tải)</h1>

  <h2>1. Chế độ hoạt động kho</h2>
  <div class="row">
    <button data-mode="peak">Cao điểm (~5s/thay đổi)</button>
    <button data-mode="night">Ban đêm (~2 phút/thay đổi)</button>
    <button data-mode="off">Tắt mô phỏng (yên tĩnh hoàn toàn)</button>
  </div>

  <h2>2. Tạo sự kiện bằng tay</h2>
  <div class="row"><button id="order">+1 đơn (199.000đ)</button><button id="order10">+10 đơn liên tiếp</button></div>
  <table id="stock"></table>

  <h2>3. Sự cố</h2>
  <div class="row"><button id="maint">Bật bảo trì (server trả 503)</button><span class="muted">Mạng kho rớt: gõ <code>o 5</code> trong terminal <code>npm run lb</code></span></div>

  <h2>4. Thống kê server</h2>
  <pre id="stats">…</pre>

  <script>
    const $ = (id) => document.getElementById(id);
    const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

    async function refresh() {
      const [stats, stock, mode] = await Promise.all(["/api/stats", "/admin/stock", "/admin/mode"].map((u) => fetch(u).then((r) => r.json())));
      $("stats").textContent = JSON.stringify(stats, null, 2);
      document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode.mode));
      $("maint").classList.toggle("on", stats.maintenance);
      $("maint").textContent = stats.maintenance ? "TẮT bảo trì" : "Bật bảo trì (server trả 503)";
      $("stock").innerHTML = "<tr><th>SKU</th><th>Tên</th><th>Tồn</th><th>Ngưỡng</th><th></th></tr>" + stock.map((s) =>
        `<tr><td>${s.sku}</td><td>${s.name}</td><td><b>${s.qty}</b></td><td>${s.threshold}</td>
         <td><button data-sku="${s.sku}" data-qty="0">Hết hàng (0)</button> <button data-sku="${s.sku}" data-qty="${s.threshold}">Sắp hết</button> <button data-sku="${s.sku}" data-qty="50">Nhập 50</button></td></tr>`).join("");
    }
    setInterval(refresh, 1000);
    refresh();

    document.addEventListener("click", async (e) => {
      const t = e.target;
      if (t.dataset.mode) await post("/admin/mode", { mode: t.dataset.mode });
      if (t.dataset.sku) await post("/admin/stock", { sku: t.dataset.sku, qty: Number(t.dataset.qty) });
      if (t.id === "order") await post("/admin/order", {});
      if (t.id === "order10") await post("/admin/order", { count: 10 });
      if (t.id === "maint") await post("/admin/maintenance", { on: !t.classList.contains("on") });
      refresh();
    });
  </script>
</body>
</html>
